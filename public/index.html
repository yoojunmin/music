<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11120f">
  <meta name="description" content="이어폰과 헤드폰으로 즐기는 나만의 음악 공간">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>조용한 방 — 음악 플레이어</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="조용한 방 홈"><span class="brand-mark">◖</span> 조용한 방</a>
      <button class="install-button" id="installButton" hidden>앱으로 설치</button>
    </header>
    <section class="intro">
      <p class="eyebrow">YOUR PRIVATE LISTENING ROOM</p>
      <h1>지금, 나만의<br><em>음악에 잠겨보세요.</em></h1>
      <p class="sub">이어폰이나 헤드폰을 연결한 뒤 재생할 수 있어요.</p>
    </section>
    <section class="gate" id="gate" aria-live="polite">
      <div class="gate-icon" id="gateIcon">⌁</div>
      <div class="gate-copy"><strong id="gateTitle">오디오 기기를 확인해 주세요</strong><span id="gateMessage">헤드폰 또는 이어폰을 연결하고 확인 버튼을 눌러주세요.</span></div>
      <button id="checkButton" class="check-button">기기 확인</button>
    </section>
    <section class="library">
      <div class="section-heading"><div><p class="eyebrow">THE COLLECTION</p><h2>오늘의 플레이리스트</h2></div><span id="trackCount" class="count">불러오는 중</span></div>
      <div class="track-list" id="trackList"></div>
      <p class="empty-note" id="emptyNote" hidden>아직 등록된 음악이 없어요. <code>public/music</code>에 음원을 넣고 <code>tracks.json</code>을 수정해 주세요.</p>
    </section>
    <footer><span>좋아하는 음악을, 조용히.</span><button id="outputButton" class="text-button" hidden>오디오 출력 선택</button></footer>
  </main>
  <div class="player" id="player">
    <div class="now-playing"><div class="mini-art">♫</div><div><strong id="nowTitle">재생할 곡을 선택하세요</strong><span id="nowArtist">—</span></div></div>
    <div class="controls"><button id="playButton" class="play-button" aria-label="재생" disabled>▶</button><div class="timeline"><div class="time-row"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" disabled></div></div>
    <audio id="audio" preload="metadata"></audio>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
